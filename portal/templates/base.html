<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · SDN Cardamomo Gelato</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-content">
            <span class="brand">SDN Cardamomo Gelato</span>
            {% if session.get('authenticated') %}
            <nav class="portal-nav" aria-label="Navegación principal">
                <a href="{{ url_for('sites') }}">Sitios</a>
                <a href="{{ url_for('ipam_list') }}">IPAM</a>
                <a href="{{ url_for('audit') }}">Bitácora</a>
            </nav>
            <form method="post" action="{{ url_for('logout') }}">
                <button class="button secondary" type="submit">Cerrar sesión</button>
            </form>
            {% endif %}
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
